name: growthos-live001

services:
  postgres:
    image: postgres:18-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
    container_name: growthos-live001-postgres
    environment:
      POSTGRES_DB: growthos_live001
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/growthos-live001-secrets/postgres-admin-password
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - growthos-live001-postgres-data:/var/lib/postgresql
      - type: bind
        source: ${GROWTHOS_LIVE001_SECRET_DIR}
        target: /run/growthos-live001-secrets
        read_only: true
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d growthos_live001
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    labels:
      growthos.environment: canary
      growthos.activation: LIVE-001

  temporal:
    image: temporalio/temporal:1.8.1@sha256:59561b9ef060eaeb1f46cb6a1842d6cbdd8a393eb3b6d315ecef5fe2f0b1d7a6
    container_name: growthos-live001-temporal
    user: "0:0"
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --port
      - "7233"
      - --metrics-port
      - "9090"
      - --db-filename
      - /var/lib/temporal/temporal.db
      - --namespace
      - growthos-backlinks-canary
      - --headless
      - --ui-disable-news-fetch
    ports:
      - "127.0.0.1:57233:7233"
      - "127.0.0.1:59090:9090"
    volumes:
      - growthos-live001-temporal-data:/var/lib/temporal
    healthcheck:
      test:
        - CMD
        - temporal
        - operator
        - cluster
        - health
        - --address
        - 127.0.0.1:7233
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    labels:
      growthos.environment: canary
      growthos.activation: LIVE-001

volumes:
  growthos-live001-postgres-data:
    name: growthos-live001-postgres-data
    labels:
      growthos.environment: canary
      growthos.activation: LIVE-001
  growthos-live001-temporal-data:
    name: growthos-live001-temporal-data
    labels:
      growthos.environment: canary
      growthos.activation: LIVE-001
