<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOCAL-PRODUCT-037 fixture</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f8;color:#172025;font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif}main{width:min(1120px,calc(100% - 40px));margin:auto;padding:26px 0}header,.head,.tabs,.actions,.tags{display:flex;gap:10px}header,.head{justify-content:space-between;align-items:flex-start}header{border-bottom:1px solid #c7d1d5;padding-bottom:18px}h1,h2,p{margin:0}h1{font-size:26px}h2{font-size:18px}.muted,dt{color:#607078}.tabs{margin-top:14px;flex-wrap:wrap}button{min-height:40px;border:1px solid #9dacb3;border-radius:6px;background:#fff;padding:8px 12px;font:inherit;font-weight:700;cursor:pointer}button:focus-visible{outline:3px solid #f1b843;outline-offset:2px}button[aria-selected=true]{border-color:#13795b;background:#e8f5ef;color:#0c5a41}.status{display:grid;grid-template-columns:1.6fr 1fr;gap:22px;border-bottom:1px solid #c7d1d5;padding:22px 0}.op{display:grid;gap:9px}.id{font:13px Consolas,monospace;overflow-wrap:anywhere}.counts{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #c7d1d5;border-radius:6px;overflow:hidden}.count{padding:10px;background:#fff;border-right:1px solid #c7d1d5}.count:last-child{border:0}.count strong{display:block;font-size:22px}.side{display:grid;justify-items:end;gap:14px}.audit{width:100%;border-left:3px solid #f1b843;background:#fff8e5;padding:10px;line-height:1.6}.list{display:grid;gap:10px;padding-top:20px}.head{align-items:baseline}.row{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;border:1px solid #c7d1d5;border-radius:6px;background:#fff;padding:15px}.detail{display:grid;gap:9px}.tags{flex-wrap:wrap}.tag{border:1px solid #a8bbb3;border-radius:99px;background:#e8f5ef;padding:3px 8px;font-size:12px;font-weight:700}.paid{border-color:#d1ad57;background:#fff7df}dl{display:grid;grid-template-columns:100px 1fr;gap:6px;margin:0;font-size:13px}dd{margin:0;overflow-wrap:anywhere}.email{border-left:3px solid #13795b;background:#edf8f3;padding:10px;font-size:13px;line-height:1.6}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:700px){main{width:calc(100% - 24px);padding-top:16px}header,.head{display:grid}.status,.row{grid-template-columns:1fr}.counts{grid-template-columns:repeat(2,1fr)}.side{justify-items:stretch}.actions button{flex:1}dl{grid-template-columns:88px 1fr}}
</style>
</head>
<body>
<main>
<header><div><h1>网站推荐</h1><p class="muted">同一供给任务自动同步已发布结果</p><div class="tabs" role="tablist"><button id="a" role="tab">Alpha 工业设备</button><button id="b" role="tab">Beta 教育软件</button></div></div><span class="tag">recommendation-operation.v1</span></header>
<section class="status">
<div class="op"><h2>供给任务</h2><p class="id" id="op"></p><p id="stage"></p><div class="counts"><div class="count">原始<strong id="raw"></strong></div><div class="count">匹配<strong id="fit"></strong></div><div class="count">联系人<strong id="contact"></strong></div><div class="count">已发布<strong id="published"></strong></div></div></div>
<div class="side"><div class="actions"><button id="resume" hidden>继续原任务</button><button id="refresh">重新读取</button></div><div class="audit">GET 读取：<strong id="gets"></strong><br>Provider 调用：<strong id="providers">0</strong><br>新建 operation：<strong>1</strong></div></div>
</section>
<section class="list"><div class="head"><h2>统一推荐列表</h2><p class="muted" id="cursor"></p></div><div id="rows"></div></section>
<p class="sr" id="announce" role="status" aria-live="polite"></p>
</main>
<script>
const defs={a:{op:"operation-037-alpha-same-id",n:[42,12,7,6],c:"paid 3/r2/w4 · resource 6/r1/w2"},b:{op:"operation-037-beta-isolated",n:[31,9,5,4],c:"paid 2/r1/w3 · resource 6/r1/w1"}};
const rows={a:[
["manufacturing-insights.example","工业自动化、北美制造业受众与项目关键词一致","DataForSEO","paid 标识，未自动购买","DR 67 · DataForSEO fixture","editor@manufacturing-insights.example","/contact · SafeFetch 公开页面"],
["factory-tech-review.example","资源库标签 manufacturing、automation 与项目 Blueprint 匹配","资源库","free","Authority 74 · resource library，非 DataForSEO 指标","submissions@factory-tech-review.example","/write-for-us · SafeFetch 公开页面"]
],b:[["learning-platforms.example","K-12 教育技术、英语市场与项目受众一致","资源库","paid 属性，仅作标识","Authority 69 · resource library，非 DataForSEO 指标","editorial@learning-platforms.example","/contributors · SafeFetch 公开页面"]]};
const added=["industrial-operations.example","维护运营主题、美国市场与设备可靠性关键词匹配","资源库","free","Authority 71 · resource library，非 DataForSEO 指标","desk@industrial-operations.example","/editorial/contact · SafeFetch 公开页面"];
let project=localStorage.getItem("lp037-project")||"a",poll=0,readCount=0,stage="contact",terminal=false,timer;
function operation(p){const k="growthos:recommendation-operation:"+p;let v=localStorage.getItem(k);if(!v){v=defs[p].op;localStorage.setItem(k,v)}return v}
function render(){
const d=defs[project];a.setAttribute("aria-selected",project==="a");b.setAttribute("aria-selected",project==="b");op.textContent="operationId: "+operation(project);[raw,fit,contact,published].forEach((e,i)=>e.textContent=d.n[i]);cursor.textContent=d.c;document.querySelector("#gets").textContent=String(readCount);resume.hidden=stage!=="pause"||terminal;
document.querySelector("#stage").textContent=terminal?"TARGET_REACHED：真实终态，轮询已停止":stage==="pause"?"PAUSED_BUDGET：保持连接，可继续原任务":"联系人收敛中：自动轮询同一 operation";
document.querySelector("#rows").innerHTML=rows[project].map(r=>`<article class="row"><div class="detail"><h2>${r[0]}</h2><p class="muted">${r[1]}</p><div class="tags"><span class="tag">${r[2]}</span><span class="tag ${r[3].includes("paid")?"paid":""}">${r[3]}</span><span class="tag">P1 · 低风险</span></div><dl><dt>关键词/市场</dt><dd>${project==="a"?"industrial automation · US/en":"education software · US/en"}</dd><dt>指标</dt><dd>${r[4]}</dd><dt>相关页面</dt><dd>${r[6].split(" · ")[0]}</dd></dl></div><div class="email"><strong>合规公开邮箱</strong><br>${r[5]}<br><span class="muted">来源：${r[6]}</span></div></article>`).join("")}
function read(source){readCount++;poll++;const d=defs[project];if(project==="a"&&poll===2)stage="pause";if(project==="a"&&poll===3){stage="contact";if(!rows.a.some(r=>r[0]===added[0])){rows.a.push(added);d.n[2]++;d.n[3]++;announce.textContent="已自动同步 1 条具有公开邮箱证据的新推荐"}}if(project==="a"&&poll>=6){terminal=true;stage="complete";clearInterval(timer);timer=null}render();document.body.dataset.lastRead=source}
function start(){if(!timer&&!terminal)timer=setInterval(()=>read("automatic-get"),700)}
function change(p){project=p;localStorage.setItem("lp037-project",p);poll=0;stage="contact";terminal=false;clearInterval(timer);timer=null;read("project-reconnect-get");start()}
a.onclick=()=>change("a");b.onclick=()=>change("b");refresh.onclick=()=>read("manual-get");resume.onclick=()=>{stage="contact";read("resume-same-operation-get");start()};
operation("a");operation("b");read("initial-get");start();
</script>
</body>
</html>
