[project]
name = "seo-api"
version = "0.1.0"
description = "FastAPI backend for seo"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "boto3>=1.39,<2",
    "fastapi>=0.116,<1",
    "google-auth>=2.40,<3",
    "httpx>=0.28,<1",
    "nltk>=3.9,<3.10",
    "openpyxl>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
    "pycountry>=24.6,<25",
    "pydantic-settings>=2.10,<3",
    "redis>=6,<8",
    "sqlalchemy[asyncio]>=2,<3",
    "tiktoken>=0.11,<1",
    "temporalio>=1.17,<2",
    "textstat>=0.7,<1",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
