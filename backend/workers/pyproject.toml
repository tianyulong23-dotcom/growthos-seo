[project]
name = "seo-workers"
version = "0.1.0"
description = "Python workers for seo"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.30,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.10,<3",
    "pycountry>=24.6,<25",
    "temporalio>=1.17,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/seo_workers"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
